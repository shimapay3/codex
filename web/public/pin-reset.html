<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Đặt lại PIN — Cloud Pay Wallet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a12;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { font-size: 0.85rem; color: #999; line-height: 1.5; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #e8e8f0;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.1em;
      outline: none;
      margin-bottom: 0.75rem;
    }
    input:focus { border-color: #9945ff; }
    button {
      width: 100%;
      padding: 0.85rem;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #9945ff, #14f195);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 1rem; font-size: 0.8rem; }
    .ok { color: #14f195; }
    .err { color: #ff6b81; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 Đặt lại mã PIN</h1>
    <p>Nhập Telegram ID và mã PIN mới (6 số) để khôi phục ví với PIN mới.</p>
    <input id="tgId" placeholder="Telegram ID" inputmode="numeric" />
    <input id="pin" placeholder="PIN mới (6 số)" inputmode="numeric" maxlength="6" />
    <button id="btn" onclick="resetPin()">Đặt lại PIN</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    async function resetPin() {
      const tgId = document.getElementById('tgId').value.trim()
      const pin = document.getElementById('pin').value.trim()
      const msg = document.getElementById('msg')
      const btn = document.getElementById('btn')

      if (!tgId || !/^\d{1,20}$/.test(tgId)) {
        msg.className = 'msg err'
        msg.textContent = 'Telegram ID không hợp lệ'
        return
      }
      if (!/^\d{6}$/.test(pin)) {
        msg.className = 'msg err'
        msg.textContent = 'PIN phải gồm đúng 6 chữ số'
        return
      }

      btn.disabled = true
      msg.className = 'msg'
      msg.textContent = 'Đang xử lý…'

      try {
        const res = await fetch('/api/admin/reset-pin/' + tgId, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ pin }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Lỗi không xác định')

        // Write to localStorage with the same prefix the app uses
        localStorage.setItem('cloudpay.vault.v1', JSON.stringify(data.vault))
        localStorage.setItem('cloudpay.pin.v1', JSON.stringify(data.pinWrap))
        localStorage.setItem('cloudpay.pinEnabled.v1', JSON.stringify(data.pinEnabled))

        msg.className = 'msg ok'
        msg.textContent = 'Đã đặt lại PIN thành công! Đang chuyển về ví…'
        setTimeout(() => { window.location.href = '/' }, 1500)
      } catch (err) {
        msg.className = 'msg err'
        msg.textContent = err.message
        btn.disabled = false
      }
    }

    // Auto-fill from query params
    const params = new URLSearchParams(window.location.search)
    if (params.get('tgId')) document.getElementById('tgId').value = params.get('tgId')
    if (params.get('pin')) document.getElementById('pin').value = params.get('pin')
  </script>
</body>
</html>
