name: chrome-extension-injector

services:
  preview:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    # Chỉ mount những thư mục cần xem trước: thư mục gốc của repo là 0700 nên
    # nginx (user `nginx`) không thể đi xuyên qua nó.
    volumes:
      - ./preview:/usr/share/nginx/html/preview:ro
      - ./popup:/usr/share/nginx/html/popup:ro
      - ./injected:/usr/share/nginx/html/injected:ro
      - ./icons:/usr/share/nginx/html/icons:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/preview/index.html >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
