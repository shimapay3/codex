# Base44 development environment for the Chrome OS / passkey "Hello World" sample page.
#
# The app is one static file (index.html, HTML+CSS+JS inline): there is no
# framework, no package manager and no build step, so the "app service" is a
# plain runtime image that serves the checkout straight from the bind mount.
# Nothing is baked into an image — the bytes the server returns ARE the source,
# so editing index.html is live on the next page load (there is no bundler to
# trigger hot reload; force a preview refresh after editing).
#
# The service intentionally runs as root inside the container: the sandbox
# checkout is mounted from a root-owned, non-world-readable directory, which a
# dropped privilege could not traverse, and the server would answer 403 for
# every file. Nothing is installed at start, so there is no dependency step.
#
# Sandbox note: the preview proxy reaches the container through host port 3000,
# and what the container receives is Host: <port>-<sandbox id>.$BASE44_SANDBOX_HOST_DOMAIN.
# python's http.server does not validate the Host header, so no host/origin
# allowlist is needed and no sandbox-only env override is required here.

name: base44-dev

services:
  web:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /site
    # serve.py = http.server + `Cache-Control: no-store`, để sửa CSS/JS xong tải lại
    # là thấy ngay (http.server mặc định khiến trình duyệt dùng bản cache cũ).
    command:
      - python
      - serve.py
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      # Bind mount the whole checkout, read-only: edits are live, no rebuild.
      - .:/site:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
