name: cloud-pay-wallet

# Development-oriented stack: both app services run straight from the bind-mounted
# source on a plain Node runtime with live reload, so edits appear immediately.
services:
  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    command:
      ['sh', '-ec', 'npm ci --no-audit --no-fund --prefer-offline && exec node --watch index.mjs']
    environment:
      - PORT=8000
      - DATA_DIR=/data
      - NODE_ENV=development
      - DEFAULT_RPC_URL=${DEFAULT_RPC_URL:-https://rpc.localusd.cloud}
      - PRICE_ENDPOINT=${PRICE_ENDPOINT:-}
      - WATCH_POLL_MS=${WATCH_POLL_MS:-12000}
      - SOLANA_KEYPAIR_PATH=${SOLANA_KEYPAIR_PATH:-/data/payserver-keypair.json}
      - AIRDROP_DAILY_LIMIT=${AIRDROP_DAILY_LIMIT:-100}
      - AIRDROP_CRON_MS=${AIRDROP_CRON_MS:-15000}
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules
      - api_data:/data
    ports:
      - '8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund --prefer-offline && exec npm run dev']
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://api:8000
      # Bare pass-throughs: the platform supplies these. BASE44_PREVIEW_MODE
      # gates the sandbox-only host allow-list in vite.config.ts; Vite itself
      # reads __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS (>= 6.1).
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

volumes:
  api_node_modules:
  web_node_modules:
  api_data:
